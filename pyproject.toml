[build-system]  # https://hatch.pypa.io/latest/config/build/
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]  # https://packaging.python.org/en/latest/specifications/pyproject-toml/
name = "zensus2pgsql"
version = "0.2.1"
description = "A Python CLI program that collects Zensus GIS data from Germany and imports it into PostgreSQL"
readme = "README.md"
authors = [
  { name = "Travis Hathaway", email = "travis.j.hathaway@gmail.com" },
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "aiocsv>=1.4.1",
  "aiofiles>=25.1.0",
  "asyncpg>=0.31.0",
  "httpx>=0.28.1",
  "platformdirs>=4.10.0",
  "rich>=15.0.0",
  "typer (>=0.26.4)",
  "types-aiofiles>=25.1.0.20260518",
]

[project.scripts]  # https://packaging.python.org/en/latest/specifications/entry-points/
zensus2pgsql = "zensus2pgsql.cli:app"
zpg = "zensus2pgsql.cli:app"

[project.urls]  # https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
homepage = "https://github.com/travishathaway/zensus2pgsql"
source = "https://github.com/travishathaway/zensus2pgsql"
changelog = "https://github.com/travishathaway/zensus2pgsql/blob/main/CHANGELOG.md"
releasenotes = "https://github.com/travishathaway/zensus2pgsql/releases"
documentation = "https://travishathaway.github.io/zensus2pgsql"
issues = "https://github.com/travishathaway/zensus2pgsql/issues"

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump: v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "pep621"

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/config.html#xml
output = "reports/coverage.xml"

[tool.mypy]  # https://mypy.readthedocs.io/en/latest/config_file.html
junit_xml = "reports/mypy.xml"
cache_dir = "/dev/null"  # disable the sqlite incremental cache: prone to corruption, no real benefit on this codebase's size
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[tool.pytest.ini_options]  # https://docs.pytest.org/en/latest/reference/reference.html#ini-options-ref
addopts = "--color=yes --doctest-modules --exitfirst --failed-first --verbosity=2 --junitxml=reports/pytest.xml"
testpaths = ["src", "tests"]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]  # https://docs.astral.sh/ruff/settings/
fix = true
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY", "FIX", "T20", "ARG001", "COM812", "D203", "D213", "E501", "PD008", "PD009", "PGH003", "RET504", "S101", "TD003"]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pixi.workspace]  # https://pixi.sh/latest/reference/pixi_manifest/
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10,<4.0"

[tool.pixi.pypi-dependencies]
zensus2pgsql = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
commitizen = ">=4.16.3"
coverage = { version = ">=7.14.1", extras = ["toml"] }
ipykernel = ">=7.2.0"
ipython = ">=8.39.0"
ipywidgets = ">=8.1.8"
mypy = ">=2.1.0"
pre-commit = ">=4.6.0"
pytest = ">=9.0.3"
pytest-asyncio = ">=1.4.0"
pytest-mock = ">=3.15.1"
pytest-sugar = ">=1.1.1"
pytest-xdist = ">=3.8.0"
ruff = ">=0.15.15"

[tool.pixi.feature.dev.tasks]
lint = "pre-commit run --all-files --color always"
test-run = "coverage run"
test-report = { cmd = "coverage report", depends-on = ["test-run"] }
test-xml = { cmd = "coverage xml", depends-on = ["test-run"] }
test = { depends-on = ["test-report", "test-xml"] }

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-material = ">=9.7.6"

[tool.pixi.feature.docs.tasks]
docs = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"] }
py310 = { features = ["dev", "py310"] }
py311 = { features = ["dev", "py311"] }
py312 = { features = ["dev", "py312"] }
py313 = { features = ["dev", "py313"] }
py314 = { features = ["dev", "py314"] }
